<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b6fbc"/><stop offset=".55" stop-color="#6ea9de"/><stop offset="1" stop-color="#cfe6f7"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E7CC2"/><stop offset="1" stop-color="#1B5FA8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="380" fill="url(#sky)"/>
  <!-- matahari -->
  <circle cx="980" cy="92" r="52" fill="#FDC500" opacity=".95"/>
  <circle cx="980" cy="92" r="72" fill="#FDC500" opacity=".18"/>
  <!-- awan -->
  <g fill="#ffffff" opacity=".85">
    <ellipse cx="230" cy="80" rx="70" ry="24"/><ellipse cx="300" cy="70" rx="55" ry="22"/>
    <ellipse cx="700" cy="55" rx="60" ry="20"/><ellipse cx="760" cy="62" rx="46" ry="18"/>
  </g>
  <!-- gunung berapi belakang -->
  <path d="M0,300 L150,150 L210,190 L300,110 L420,300 Z" fill="#6f6257"/>
  <path d="M300,110 L270,150 L330,150 Z" fill="#8a7a6b"/>
  <ellipse cx="300" cy="108" rx="26" ry="10" fill="#9c8b7a"/>
  <path d="M300,100 q-6,-40 10,-70 q10,26 -2,52 q18,-14 24,-44 q10,40 -14,66 Z" fill="#cfd6dd" opacity=".8"/>
  <!-- perbukitan hijau -->
  <path d="M0,300 Q220,230 460,290 T900,285 T1200,300 L1200,380 L0,380 Z" fill="#7fbf7a"/>
  <path d="M0,330 Q300,280 640,320 T1200,325 L1200,380 L0,380 Z" fill="#5fa85e"/>
  <!-- laut kanan -->
  <path d="M780,300 Q950,285 1200,300 L1200,380 L780,380 Z" fill="url(#sea)"/>
  <g stroke="#ffffff" stroke-width="3" opacity=".5" fill="none">
    <path d="M840,330 q18,-10 36,0 t36,0"/><path d="M980,352 q18,-10 36,0 t36,0"/>
  </g>
  <!-- kota / rumah siluet -->
  <g fill="#3f5d7a" opacity=".9">
    <rect x="520" y="250" width="34" height="60" rx="3"/><rect x="560" y="235" width="26" height="75" rx="3"/>
    <rect x="592" y="258" width="30" height="52" rx="3"/><rect x="628" y="242" width="22" height="68" rx="3"/>
  </g>
  <!-- pohon -->
  <g>
    <ellipse cx="120" cy="318" rx="26" ry="30" fill="#2f8f4e"/><rect x="115" y="330" width="10" height="26" fill="#7a5a34"/>
    <ellipse cx="170" cy="326" rx="20" ry="24" fill="#256f3e"/><rect x="166" y="336" width="8" height="22" fill="#7a5a34"/>
  </g>
