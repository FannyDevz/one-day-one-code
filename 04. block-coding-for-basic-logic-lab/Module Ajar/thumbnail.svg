<!-- Indent line for loop body -->
<line x1="666" y1="130" x2="666" y2="285" stroke="rgba(180,83,9,0.6)" stroke-width="3" stroke-linecap="round"/>

<!-- Block inside loop: Nyalakan Merah -->
<g filter="url(#blockShadow)" transform="translate(680,135)">
  <rect width="420" height="48" rx="10" fill="#DC2626"/>
  <circle cx="24" cy="24" r="14" fill="rgba(0,0,0,0.2)"/>
  <circle cx="24" cy="24" r="9" fill="#EF4444" filter="url(#glow)"/>
  <text x="50" y="31" font-size="18" font-weight="700" fill="white">Nyalakan Merah</text>
  <rect x="280" y="12" width="60" height="24" rx="8" fill="rgba(0,0,0,0.25)"/>
  <text x="310" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="white">30</text>
  <text x="350" y="29" font-size="12" fill="rgba(255,255,255,0.7)">dtk</text>
</g>

<!-- Block inside loop: Nyalakan Kuning -->
<g filter="url(#blockShadow)" transform="translate(680,195)">
  <rect width="420" height="48" rx="10" fill="#B45309"/>
  <circle cx="24" cy="24" r="14" fill="rgba(0,0,0,0.2)"/>
  <circle cx="24" cy="24" r="9" fill="#FBBF24" filter="url(#glow)"/>
  <text x="50" y="31" font-size="18" font-weight="700" fill="white">Nyalakan Kuning</text>
  <rect x="280" y="12" width="60" height="24" rx="8" fill="rgba(0,0,0,0.25)"/>
  <text x="310" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="white">5</text>
  <text x="350" y="29" font-size="12" fill="rgba(255,255,255,0.7)">dtk</text>
</g>

<!-- Block inside loop: Nyalakan Hijau -->
<g filter="url(#blockShadow)" transform="translate(680,255)">
  <rect width="420" height="48" rx="10" fill="#166534"/>
  <circle cx="24" cy="24" r="14" fill="rgba(0,0,0,0.2)"/>
  <circle cx="24" cy="24" r="9" fill="#22C55E" filter="url(#glow)"/>
  <text x="50" y="31" font-size="18" font-weight="700" fill="white">Nyalakan Hijau</text>
  <rect x="280" y="12" width="60" height="24" rx="8" fill="rgba(0,0,0,0.25)"/>
  <text x="310" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="white">25</text>
  <text x="350" y="29" font-size="12" fill="rgba(255,255,255,0.7)">dtk</text>
</g>

<!-- End loop footer -->
<rect x="650" y="313" width="480" height="28" rx="8" fill="rgba(180,83,9,0.4)" stroke="rgba(180,83,9,0.5)" stroke-width="1"/>
<text x="862" y="331" text-anchor="middle" font-size="12" fill="rgba(255,255,255,0.6)" font-style="italic">Akhir Ulangi Selamanya</text>

<!-- Block: Berhenti -->
<g filter="url(#blockShadow)" transform="translate(650,354)">
  <rect width="480" height="48" rx="12" fill="#065F46" stroke="#059669" stroke-width="2"/>
  <text x="24" y="30" font-size="20">■</text>
  <text x="56" y="32" font-size="18" font-weight="800" fill="white">Berhenti</text>
  <circle cx="448" cy="24" r="10" fill="rgba(34,197,94,0.3)"/>
  <text x="448" y="29" text-anchor="middle" font-size="14">✅</text>
</g>

<!-- Simulation preview mini: traffic light to the right -->
<g transform="translate(660, 415)">
  <rect width="200" height="55" rx="10" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="14" y="20" font-size="11" fill="rgba(255,255,255,0.5)">🎮 Simulasi</text>
  <!-- Mini traffic light -->
  <rect x="80" y="8" width="40" height="40" rx="8" fill="#1F2937"/>
  <circle cx="100" cy="18" r="7" fill="#EF4444" opacity="0.4"/>
  <circle cx="100" cy="28" r="7" fill="#FBBF24" opacity="0.4"/>
  <circle cx="100" cy="38" r="7" fill="#22C55E" filter="url(#glow)"/>
  <!-- Cars -->
  <text x="130" y="36" font-size="14">🚗</text>
  <text x="148" y="36" font-size="14">🚗</text>
</g>

<!-- ─── BOTTOM STRIP: LEVEL CARDS ─── -->
<rect x="0" y="490" width="1200" height="140" fill="rgba(0,0,0,0.3)"/>
<line x1="0" y1="490" x2="1200" y2="490" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

<!-- Level cards: evenly spaced -->
<!-- LV1 -->
<g transform="translate(50,505)">
  <rect width="190" height="108" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <text x="95" y="52" text-anchor="middle" font-size="36">🗺️</text>
  <text x="95" y="78" text-anchor="middle" font-size="14" font-weight="800" fill="white">Level 1</text>
  <text x="95" y="97" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.6)">Peta Petualangan</text>
</g>

<!-- LV2 -->
<g transform="translate(268,505)">
  <rect width="190" height="108" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <text x="95" y="52" text-anchor="middle" font-size="36">🌳</text>
  <text x="95" y="78" text-anchor="middle" font-size="14" font-weight="800" fill="white">Level 2</text>
  <text x="95" y="97" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.6)">Kebun Panen</text>
</g>

<!-- LV3 -->
