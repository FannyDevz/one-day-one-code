<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0f2444"/>
    <stop offset="55%" stop-color="#1e3a5f"/>
    <stop offset="100%" stop-color="#1d4ed8"/>
  </linearGradient>
  <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="rgba(255,255,255,0.12)"/>
    <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <filter id="blockShadow">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.35)"/>
  </filter>
  <filter id="softShadow">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
  </filter>
</defs>

<!-- ─── BACKGROUND ─── -->
<rect width="1200" height="630" fill="url(#bg)"/>

<!-- Decorative circles -->
<circle cx="90"  cy="90"  r="180" fill="rgba(255,255,255,0.03)"/>
<circle cx="0"   cy="400" r="250" fill="rgba(59,130,246,0.08)"/>
<circle cx="1160" cy="560" r="200" fill="rgba(29,78,216,0.1)"/>
<circle cx="900" cy="50"  r="130" fill="rgba(255,255,255,0.04)"/>

<!-- Dot grid decoration (top-right area) -->
<g fill="rgba(255,255,255,0.07)">
  <circle cx="620" cy="40"  r="3"/> <circle cx="650" cy="40"  r="3"/> <circle cx="680" cy="40"  r="3"/>
  <circle cx="620" cy="70"  r="3"/> <circle cx="650" cy="70"  r="3"/> <circle cx="680" cy="70"  r="3"/>
  <circle cx="620" cy="100" r="3"/> <circle cx="650" cy="100" r="3"/> <circle cx="680" cy="100" r="3"/>
</g>
<g fill="rgba(255,255,255,0.05)">
  <circle cx="1100" cy="200" r="3"/> <circle cx="1130" cy="200" r="3"/>
  <circle cx="1100" cy="230" r="3"/> <circle cx="1130" cy="230" r="3"/>
  <circle cx="1100" cy="260" r="3"/> <circle cx="1130" cy="260" r="3"/>
</g>

<!-- ─── LEFT PANEL: TITLE ─── -->

<!-- Logo background circle -->
<circle cx="100" cy="105" r="62" fill="rgba(59,130,246,0.25)" filter="url(#glow)"/>
<circle cx="100" cy="105" r="52" fill="rgba(255,255,255,0.12)"/>
<text x="100" y="128" text-anchor="middle" font-size="54">🔢</text>

<!-- Title -->
<text x="185" y="82" font-size="54" font-weight="800" fill="white" letter-spacing="-1">Lab Coding Blok</text>

<!-- Subtitle pill -->
<rect x="185" y="96" width="256" height="36" rx="18" fill="rgba(59,130,246,0.4)" stroke="rgba(100,160,255,0.4)" stroke-width="1.5"/>
<text x="313" y="119" text-anchor="middle" font-size="18" font-weight="700" fill="rgba(255,255,255,0.9)">✦ Logika Dasar ✦</text>

<!-- Tagline -->
<text x="185" y="162" font-size="17" fill="rgba(255,255,255,0.65)">Belajar pemrograman visual tanpa instalasi</text>

<!-- Concept badges -->
<g transform="translate(185,185)">
  <!-- Sequence -->
  <rect width="118" height="32" rx="16" fill="rgba(234,88,12,0.7)" stroke="rgba(234,88,12,0.9)" stroke-width="1.5"/>
  <text x="59" y="21" text-anchor="middle" font-size="13" font-weight="700" fill="white">▶ Urutan</text>

  <!-- Loop -->
  <rect x="128" width="100" height="32" rx="16" fill="rgba(180,83,9,0.7)" stroke="rgba(180,83,9,0.9)" stroke-width="1.5"/>
  <text x="178" y="21" text-anchor="middle" font-size="13" font-weight="700" fill="white">↻ Loop</text>

  <!-- Kondisi -->
  <rect x="238" width="118" height="32" rx="16" fill="rgba(124,58,237,0.7)" stroke="rgba(124,58,237,0.9)" stroke-width="1.5"/>
  <text x="297" y="21" text-anchor="middle" font-size="13" font-weight="700" fill="white">◆ Kondisi</text>
</g>

<!-- Description text -->
<text x="185" y="248" font-size="15" fill="rgba(255,255,255,0.55)">5 level · 15 tantangan · Skor &amp; lencana · Jurnal refleksi</text>

<!-- Divider line from left panel -->
<line x1="185" y1="270" x2="555" y2="270" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

<!-- Screenshot-style mini preview area -->
<rect x="185" y="285" width="370" height="175" rx="10" fill="rgba(0,0,0,0.25)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
<rect x="185" y="285" width="370" height="22" rx="10" fill="rgba(255,255,255,0.08)"/>
<circle cx="202" cy="296" r="4" fill="#EF4444" opacity="0.8"/>
<circle cx="216" cy="296" r="4" fill="#FBBF24" opacity="0.8"/>
<circle cx="230" cy="296" r="4" fill="#22C55E" opacity="0.8"/>
<text x="360" y="299" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.4)">💻 Program Kamu</text>

<!-- Mini blocks inside the preview -->
<g transform="translate(205, 315)">
  <rect width="160" height="28" rx="6" fill="rgba(234,88,12,0.8)"/>
  <text x="10" y="19" font-size="12" font-weight="700" fill="white">→ Maju</text>
</g>
<g transform="translate(205, 350)">
  <rect width="300" height="28" rx="6" fill="rgba(180,83,9,0.85)" stroke="rgba(180,83,9,1)" stroke-width="1"/>
  <text x="10" y="19" font-size="12" font-weight="700" fill="white">↻ Ulangi 3 kali</text>
</g>
<g transform="translate(225, 382)">
  <rect width="260" height="28" rx="6" fill="rgba(234,88,12,0.8)"/>
  <text x="10" y="19" font-size="12" font-weight="700" fill="white">→ Maju</text>
</g>
<g transform="translate(205, 418)">
  <rect width="170" height="28" rx="6" fill="rgba(5,150,105,0.85)"/>
  <text x="10" y="19" font-size="12" font-weight="700" fill="white">■ Berhenti</text>
</g>

<!-- ─── RIGHT PANEL: BLOCK ILLUSTRATION ─── -->

<!-- Right panel background -->
<rect x="620" y="30" width="540" height="450" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

<!-- Vertical divider -->
<line x1="620" y1="30" x2="620" y2="480" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

<!-- BLOCK ILLUSTRATION: Stacked blocks -->

<!-- Block: Ulangi Selamanya (container) -->
<g filter="url(#blockShadow)" transform="translate(650,60)">
  <rect width="480" height="58" rx="12" fill="#B45309"/>
  <rect x="2" y="2" width="476" height="27" rx="10" fill="rgba(255,255,255,0.1)"/>
