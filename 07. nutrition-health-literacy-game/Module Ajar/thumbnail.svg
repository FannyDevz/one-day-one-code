  <text x="191" y="89"  text-anchor="middle" font-size="12" fill="rgba(0,0,0,0.30)" font-family="sans-serif">⅓ piring</text>
  <text x="133" y="252" text-anchor="middle" font-size="14" font-weight="800" fill="rgba(0,0,0,0.45)" font-family="sans-serif">LAUK</text>
  <text x="133" y="266" text-anchor="middle" font-size="11" fill="rgba(0,0,0,0.30)" font-family="sans-serif">⅙ piring</text>
  <text x="248" y="252" text-anchor="middle" font-size="14" font-weight="800" fill="rgba(0,0,0,0.45)" font-family="sans-serif">BUAH</text>
  <text x="248" y="266" text-anchor="middle" font-size="11" fill="rgba(0,0,0,0.30)" font-family="sans-serif">⅙ piring</text>
  <text x="368" y="148" text-anchor="middle" font-size="13" font-weight="800" fill="rgba(0,0,0,0.45)" font-family="sans-serif">MAKANAN</text>
  <text x="368" y="163" text-anchor="middle" font-size="13" font-weight="800" fill="rgba(0,0,0,0.45)" font-family="sans-serif">POKOK</text>
  <text x="368" y="178" text-anchor="middle" font-size="11" fill="rgba(0,0,0,0.30)" font-family="sans-serif">⅓ piring</text>
</g>

