  <text x="148" y="200" text-anchor="middle" font-size="30">🥕</text>
  <text x="235" y="200" text-anchor="middle" font-size="30">🍅</text>
  <text x="133" y="320" text-anchor="middle" font-size="44">🍗</text>
  <text x="248" y="320" text-anchor="middle" font-size="44">🍌</text>
  <text x="368" y="200" text-anchor="middle" font-size="44">🍚</text>
  <text x="368" y="270" text-anchor="middle" font-size="32">🍞</text>

  <!-- Section labels -->
