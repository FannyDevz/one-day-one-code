  <!-- Food sections (clipped to circle) -->
  <!-- Plate food area: from (74,44) to (426,396) → 352×352px, centered at (250,220) -->
  <!-- Sayuran top-left: 2/3 width, 1/2 height = 234×176 -->
  <!-- Lauk bottom-left: 1/2 of left half width, 1/2 height = 117×176 -->
  <!-- Buah bottom-center: 1/2 of left half width, 1/2 height = 117×176 -->
  <!-- Pokok right: 1/3 width, full height = 117×352 -->
  <g clip-path="url(#pc)">
    <rect x="74"  y="44"  width="235" height="176" fill="#BBFAD0"/>  <!-- Sayuran -->
    <rect x="74"  y="220" width="117" height="176" fill="#FDBA74"/>  <!-- Lauk -->
    <rect x="191" y="220" width="118" height="176" fill="#F9A8D4"/>  <!-- Buah -->
    <rect x="309" y="44"  width="117" height="352" fill="#FDE68A"/>  <!-- Pokok -->
  </g>

  <!-- White dividers (clipped) -->
