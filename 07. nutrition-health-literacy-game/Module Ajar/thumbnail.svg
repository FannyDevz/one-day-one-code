    <line x1="309" y1="44"  x2="309" y2="396" stroke-width="4"/>
    <line x1="74"  y1="220" x2="309" y2="220" stroke-width="3.5"/>
    <line x1="191" y1="220" x2="191" y2="396" stroke-width="3"/>
