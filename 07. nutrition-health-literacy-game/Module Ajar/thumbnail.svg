<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,sans-serif">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#052e16"/>
    <stop offset="50%"  stop-color="#14532d"/>
    <stop offset="100%" stop-color="#15803d"/>
  </linearGradient>
  <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="rgba(255,255,255,0.13)"/>
    <stop offset="100%" stop-color="rgba(255,255,255,0.04)"/>
  </linearGradient>
  <radialGradient id="rimGold" cx="38%" cy="28%" r="72%">
    <stop offset="0%"   stop-color="#F7E070"/>
    <stop offset="45%"  stop-color="#C9A84C"/>
    <stop offset="100%" stop-color="#7A5C00"/>
  </radialGradient>
  <radialGradient id="rimCream" cx="40%" cy="35%" r="65%">
    <stop offset="0%"   stop-color="#FFFEF8"/>
    <stop offset="100%" stop-color="#FFF3C4"/>
  </radialGradient>
  <clipPath id="pc"><circle cx="250" cy="220" r="176"/></clipPath>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
  <filter id="dropshadow"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="rgba(0,0,0,0.45)"/></filter>
  <filter id="softsh"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="rgba(0,0,0,0.25)"/></filter>
</defs>

<!-- ─── BACKGROUND ─── -->
<rect width="1200" height="630" fill="url(#bg)"/>

